allowBuilds:
  esbuild: true
  tldjs: false
minimumReleaseAgeExclude:
  - knip@6.25.0
  - "@ai-sdk/anthropic@4.0.10"
  - "@ai-sdk/gateway@4.0.14"
  - "@ai-sdk/google-vertex@5.0.13"
  - "@ai-sdk/google@4.0.10"
  - "@ai-sdk/openai-compatible@3.0.6"
  - "@ai-sdk/openai@4.0.9"
  - "@ai-sdk/provider-utils@5.0.6"
  - ai@7.0.18
# Every package that asks for `vite` or `vitest` gets the copies Vite+ ships.
# `vite` is Vite+'s core under the upstream name, so packages that import
# `vite` (Vitest) keep working. It is spelled out here instead of a catalog
# entry because nothing in package.json depends on `vite` directly (knip would
# report the catalog entry as unused). Keep it at the vite-plus version.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: "catalog:"
# Vite+ (`vp`) and the tools it drives.
catalog:
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
  # `vp` resolves oxfmt and oxlint from the working directory before its own
  # copies, so a checkout nested in another project would otherwise run that
  # project's formatter and linter. Keep these at the versions vite-plus
  # bundles (its dist/toolchain.json).
  oxfmt: 0.74.0
  oxlint: 1.89.0
# Packages declare peer ranges on upstream vite/vitest; the aliased copies satisfy them.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

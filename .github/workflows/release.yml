name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest

    # `id-token: write` lets pnpm exchange a GitHub OIDC token for a short-lived
    # npm credential (npm trusted publishing), so no NPM_TOKEN secret is needed.
    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Verify release source
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          package_version="$(jq -r .version package.json)"
          if [ "$RELEASE_TAG" != "v${package_version}" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi

          git fetch origin main --no-tags
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(git rev-parse 'origin/main^{commit}')"
          if ! git merge-base --is-ancestor "$release_commit" "$main_commit"; then
            echo "Release commit $release_commit is not in the current main history"
            exit 1
          fi

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.10.14
          sha256: 50be7185bcf75929f01cc5630276bcb43ca367f7c5b176e2580903d28c611dc4
          experimental: true
          # Do not restore tools from a cache other jobs could have written.
          cache: false

      # Lifecycle scripts are skipped so no dependency install script can run
      # while the OIDC publish credential is available. The root `prepare`
      # (git hooks + rulesync generate) is not needed: generated files are
      # committed and CI checks they are up to date.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run quality checks
        run: |
          pnpm run check
          pnpm run secretlint
          pnpm run cspell
          pnpm run test

      - name: Build project
        run: pnpm run build

      # `dist/` was built and checked above; `--ignore-scripts` publishes it as
      # is instead of re-running `prepublishOnly`/`prepare` with the credential.
      - name: Publish to npm
        run: pnpm publish --no-git-checks --ignore-scripts
